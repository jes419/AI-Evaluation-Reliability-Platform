
[project]
name = "ai-evaluation-reliability-platform"
version = "0.1.0"
description = "A reliable platform for managing and evaluating AI assessment runs."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
